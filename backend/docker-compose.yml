# PostgreSQL local para desenvolvimento. Em produção a API usa o NeonDB.
# Subir: docker compose up -d   |   Parar: docker compose down   (os dados ficam no volume)
services:
  db:
    image: postgres:17-alpine
    container_name: curriculo-postgres
    environment:
      POSTGRES_USER: curriculo
      POSTGRES_PASSWORD: curriculo
      POSTGRES_DB: curriculo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculo -d curriculo"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
